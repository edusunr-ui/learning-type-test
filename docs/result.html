<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학습유형검사 결과</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="result-page">

      <div class="result-actions">
