<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>학습유형검사 관리자</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-brand">
        <img class="brand-logo brand-logo--header" src="./assets/su-him-hufs-logo.png" alt="운정 본원 수학의힘 외대 HS어학원">
        <p class="eyebrow">운정 수학의힘∫외대HS어학원</p>
        <h1>학습유형검사 관리자</h1>
      </div>
    </header>

    <main class="admin-shell">
      <section id="adminLoginView" class="admin-card admin-login-card">
        <div class="admin-card-copy">
          <p class="eyebrow">Teacher Only</p>
          <h2>선생님 전용 결과 페이지</h2>
          <p>학생 제출 결과를 확인하고, 개별 결과지를 열어 인쇄할 수 있습니다.</p>
        </div>
        <form id="adminLoginForm" class="admin-login-form">
          <label>
            <span>관리자 비밀번호</span>
            <input id="adminPasswordInput" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">로그인</button>
          <p id="adminLoginMessage" class="admin-message" hidden></p>
        </form>
      </section>

      <section id="adminPortalView" class="admin-card admin-portal" hidden>
        <div class="admin-toolbar">
          <div>
            <p class="eyebrow">Results</p>
            <h2>제출된 검사 결과</h2>
          </div>
          <div class="admin-toolbar-actions">
            <label class="admin-search">
              <span class="sr-only">검색</span>
              <input id="adminSearchInput" type="search" placeholder="이름, 학교, 유형 검색">
            </label>
            <button id="adminRefreshBtn" type="button">새로고침</button>
            <button id="adminLogoutBtn" type="button">로그아웃</button>
          </div>
        </div>

        <div class="admin-summary-bar">
          <p id="adminResultCount">결과를 불러오는 중입니다.</p>
          <p class="admin-helper">개별 카드의 `결과 보기`를 누르면 기존 결과지 형식으로 새 창이 열립니다.</p>
        </div>

        <div id="adminResultsEmpty" class="admin-empty" hidden>
          표시할 결과가 없습니다.
        </div>

        <div id="adminResultsList" class="admin-results-list"></div>
      </section>
    </main>

    <script src="./sheets-config.js"></script>
    <script src="./teacher-admin.js"></script>
  </body>
</html>
